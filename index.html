<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - MGC App</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- Filtro oscuro sobre el fondo -->
  <div class="overlay"></div>

  <!-- Contenedor del Login -->
  <main class="login-card">
    <div class="card-header">
      <h2>Bienvenido</h2>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <!-- Contenedor para mensajes de error o éxito -->
    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario o Email</label>
        <input 
          type="text" 
          id="username" 
          placeholder="admin" 
          required 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        />
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        Ingresar
      </button>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');

      // Reiniciar las clases de la alerta en cada intento
      alertBox.className = 'alert';

      fetch('./usuarios.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('No se pudo cargar el archivo de usuarios');
          }
          return response.json();
        })
        .then(data => {
          // Accedemos al array dentro de 'usuarios' y usamos las propiedades 'usuario' y 'contraseña'
          const user = data.usuarios.find(
            u => u.usuario === usernameInput && u.contraseña === passwordInput
          );

          if (user) {
            alertBox.textContent = 'Inicio de sesión exitoso';
            alertBox.classList.add('alert-success');
            window.location.href = 'pages/estacionamientos2.html';
          } else {
            alertBox.textContent = 'Usuario o contraseña incorrectos';
            alertBox.classList.add('alert-error');
          }
        })
        .catch(error => {
          console.error('Error al validar credenciales:', error);
          alertBox.textContent = 'Error al procesar el inicio de sesión.';
          alertBox.classList.add('alert-error');
        });
    });
  </script>
</body>
</html>
